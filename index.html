<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Shelf</title>
<meta name="description" content="Skill Claude pilihan per kategori: punya sendiri, resmi dari Anthropic, dan repo komunitas.">
<meta name="theme-color" content="#151614">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Skill Shelf">
<meta property="og:description" content="Skill Claude pilihan per kategori: punya sendiri, resmi dari Anthropic, dan repo komunitas.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="hero">
    <p class="eyebrow">AI Builder &amp; Creative Workflow</p>
    <h1>Skill Shelf</h1>
    <p class="lead">Skill pilihan per kategori: punya sendiri, resmi dari Anthropic, dan repo komunitas. Cari skill, buka source-nya, mulai pakai.</p>
  </header>

  <div id="crew" class="crew" hidden></div>

  <label class="search" for="q">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Cari nama atau deskripsi skill…" aria-describedby="count" autocomplete="off" maxlength="100">
    <button id="clear" type="button" hidden>Bersihkan</button>
  </label>

  <div class="bar">
    <nav class="tabs" id="tabs" aria-label="Filter kategori skill"></nav>
    <span id="count" class="count" role="status" aria-live="polite"></span>
  </div>

  <div id="catalog"><p class="empty">Memuat skill…</p></div>

  <footer id="footer" class="footer"></footer>
</main>
<script src="app.js" defer></script>
</body>
</html>
